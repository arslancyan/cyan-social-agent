name: CYAN Worker

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: cyan-worker-production
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run CYAN worker
        env:
          CYAN_APP_URL: ${{ vars.CYAN_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CYAN_APP_URL:-}" ]; then
            echo "CYAN_APP_URL repository variable is not configured."
            exit 1
          fi
          health_status="$(curl --silent --show-error --max-time 20 --output /tmp/cyan-health.json --write-out "%{http_code}" "${CYAN_APP_URL%/}/api/health")"
          echo "CYAN health HTTP status: ${health_status}"
          cat /tmp/cyan-health.json
          if [ "${health_status}" != "200" ]; then
            echo "CYAN runtime health preflight failed."
            exit 1
          fi
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H "Accept: application/json; api-version=2.0" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CYAN_APP_URL%/}")"
          token="$(printf '%s' "$oidc_token" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --silent --show-error --max-time 280 \
            -X POST "${CYAN_APP_URL%/}/api/worker/tick" \
            -H "x-github-oidc-token: ${token}" \
            -H "Accept: application/json"
